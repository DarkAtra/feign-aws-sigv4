name: Build & Release
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next
    paths:
      - '**/src/**'
      - '**/pom.xml'
      - '.releaserc.json'
      - 'pom.xml'

concurrency:
  group: ci-main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # used by aws-actions/configure-aws-credentials
      id-token: write
    outputs:
      tests-outcome: ${{ steps.run-tests.outcome }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '17.0.20+101'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.2

      - name: Setup AWS Credentials for Infrastructure
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: eu-central-1
          role-to-assume: arn:aws:iam::956243129466:role/github-deployer

      - id: apply-infrastructure
        name: Apply Infrastructure for Integration Tests
        working-directory: integration-tests/infrastructure
        run: |
          terraform init
          terraform apply -auto-approve
          echo "integration-test-role-arn=$(terraform output -raw integration_test_role_arn)" >> $GITHUB_OUTPUT
          echo "api-gateway-url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT

      - name: Setup AWS Credentials for Integration Tests
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ steps.apply-infrastructure.outputs.integration-test-role-arn }}

      - id: run-tests
        name: Run Tests
        run: |
          mvn -B -ntp clean install failsafe:integration-test failsafe:verify -DapiGatewayUrl=${{ steps.apply-infrastructure.outputs.api-gateway-url }}

      - name: Setup AWS Credentials for Infrastructure
        uses: aws-actions/configure-aws-credentials@v6.3.0
        if: always()
        with:
          aws-region: eu-central-1
          role-to-assume: arn:aws:iam::956243129466:role/github-deployer

      - name: Destroy Infrastructure for Integration Tests
        if: always()
        working-directory: integration-tests/infrastructure
        run: |
          terraform destroy -auto-approve

  build:
    name: Build & Release
    runs-on: ubuntu-24.04
    needs:
      - verify
    permissions:
      # used by cycjimmy/semantic-release-action
      contents: write
      packages: write
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '17.0.20+101'
          distribution: 'temurin'
          cache: 'maven'

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7.0.0
        if: needs.verify.outputs.tests-outcome == 'success'
        with:
          gpg_private_key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          passphrase: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - id: semantic-release
        name: Create new release
        uses: cycjimmy/semantic-release-action@v6.0.0
        if: needs.verify.outputs.tests-outcome == 'success'
        with:
          extra_plugins: |
            @semantic-release/git
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

  publish-maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-24.04
    needs:
      - build
    if: needs.build.outputs.new-release-published == 'true'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '17.0.20+101'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v7.0.0
        with:
          gpg_private_key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          passphrase: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: Publish Package
        run: |
          mvn -B -ntp versions:set -DgenerateBackupPoms=false -DnewVersion=${{ needs.build.outputs.new-release-version }}
          mvn -B -ntp -Psign-with-gpg -Ppublish-central-portal clean deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PORTAL_SECRET }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
